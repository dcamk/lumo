[package]
name = "lumo-assistant"
version = "1.8.0"
description = "Minimalist Top Notch Productivity Companion for Linux"
authors = ["Dalmácio"]
license = "MIT"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
mouse_position = "0.1.4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
zbus = "5"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
# Mesma versão usada internamente pelo Tauri/wry (ajustes de áudio do WebKitGTK)
webkit2gtk = "2.0"
# Região de entrada da janela (cliques atravessam a parte transparente)
gtk = "0.18"
# Terminal de verdade (pseudoterminal) na aba Terminal
portable-pty = "0.9"
